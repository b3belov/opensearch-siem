x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  opensearch:
    logging: *default-logging
    image: opensearchproject/opensearch:3.6.0
    container_name: opensearch
    restart: unless-stopped
    environment:
      - cluster.name=opensearch-siem
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms2g -Xmx2g}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./data/opensearch:/usr/share/opensearch/data
      - ./opensearch/config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./secrets/certs/opensearch.crt:/usr/share/opensearch/config/certs/opensearch.crt:ro
      - ./secrets/certs/opensearch.key:/usr/share/opensearch/config/certs/opensearch.key:ro
      - ./secrets/certs/root-ca.crt:/usr/share/opensearch/config/certs/root-ca.crt:ro
      - ./secrets/certs/admin.crt:/usr/share/opensearch/config/certs/admin.crt:ro
      - ./secrets/certs/admin.key:/usr/share/opensearch/config/certs/admin.key:ro
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - siem-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sku admin:${OPENSEARCH_ADMIN_PASSWORD} https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 120s
    mem_limit: 6g

  opensearch-dashboards:
    logging: *default-logging
    image: opensearchproject/opensearch-dashboards:3.6.0
    container_name: opensearch-dashboards
    restart: unless-stopped
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      - DATA_SOURCE_ENABLED=true
      - WORKSPACE_ENABLED=true
      - EXPLORE_ENABLED=true
      - OPENSEARCH_SSL_VERIFICATIONMODE=full
      - 'OPENSEARCH_SSL_CERTIFICATEAUTHORITIES=["/usr/share/opensearch-dashboards/config/certs/root-ca.crt"]'
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=/usr/share/opensearch-dashboards/config/certs/dashboards.crt
      - SERVER_SSL_KEY=/usr/share/opensearch-dashboards/config/certs/dashboards.key
      - SERVER_PUBLICBASEURL=https://${DASHBOARDS_PUBLIC_HOST:-localhost}
    volumes:
      - ./secrets/certs/root-ca.crt:/usr/share/opensearch-dashboards/config/certs/root-ca.crt:ro
      - ./secrets/certs/dashboards.crt:/usr/share/opensearch-dashboards/config/certs/dashboards.crt:ro
      - ./secrets/certs/dashboards.key:/usr/share/opensearch-dashboards/config/certs/dashboards.key:ro
    expose:
      - "5601"
    networks:
      - siem-net
    depends_on:
      opensearch:
        condition: service_healthy
    mem_limit: 1g

  dashboards-proxy:
    logging: *default-logging
    image: nginx:1.27-alpine
    container_name: dashboards-proxy
    restart: unless-stopped
    user: "101:101"
    environment:
      - DASHBOARDS_PUBLIC_HOST=${DASHBOARDS_PUBLIC_HOST:-localhost}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates/dashboards.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./secrets/certs/root-ca.crt:/etc/nginx/certs/root-ca.crt:ro
      - ./secrets/certs/dashboards-proxy.crt:/etc/nginx/certs/dashboards-proxy.crt:ro
      - ./secrets/certs/dashboards-proxy.key:/etc/nginx/certs/dashboards-proxy.key:ro
    ports:
      - "${DASHBOARDS_PROXY_BIND:-127.0.0.1}:80:80"
      - "${DASHBOARDS_PROXY_BIND:-127.0.0.1}:443:443"
    networks:
      - siem-net
    depends_on:
      opensearch-dashboards:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet --no-check-certificate https://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
      - /run:uid=101,gid=101
      - /tmp:uid=101,gid=101,mode=1777
    mem_limit: 256m

  central-logstash:
    logging: *default-logging
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    container_name: central-logstash
    restart: unless-stopped
    environment:
      - LS_JAVA_OPTS=-Xms2g -Xmx2g
      - LOGSTASH_WRITER_USER=${LOGSTASH_WRITER_USER}
      - LOGSTASH_WRITER_PASSWORD=${LOGSTASH_WRITER_PASSWORD}
    volumes:
      - ./logstash/config:/usr/share/logstash/config:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./gitops/rendered/logstash:/usr/share/logstash/gitops:ro
      - ./data/logstash:/usr/share/logstash/data
      - ./secrets/certs/root-ca.crt:/usr/share/logstash/certs/root-ca.crt:ro
    expose:
      - "9601"
    ports:
      - "127.0.0.1:9600:9600"
    networks:
      - siem-net
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600/_node/stats/pipelines >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 90s
    mem_limit: 6g

  ingest-edge:
    logging: *default-logging
    build:
      context: .
      dockerfile: ingest-edge/Dockerfile
    container_name: ingest-edge
    restart: unless-stopped
    environment:
      - LOGSTASH_URL=http://central-logstash:9601
      - INGEST_EDGE_PORT=${INGEST_EDGE_PORT:-5044}
      - INGEST_EDGE_CONFIG=/app/config/customer-auth.yml
      - INGEST_EDGE_SECRET_ROOT=/run/siem-secrets
      - INGEST_EDGE_TLS_CERT=/run/siem-certs/central.crt
      - INGEST_EDGE_TLS_KEY=/run/siem-certs/central.key
      - INGEST_EDGE_MAX_BODY_BYTES=1048576
      - INGEST_EDGE_MAX_CONCURRENCY=64
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
    volumes:
      - ./gitops/rendered/ingest-edge:/app/config:ro
      - ./secrets/local:/run/siem-secrets:ro
      - ./secrets/certs:/run/siem-certs:ro
    ports:
      - "${INGEST_EDGE_PORT:-5044}:${INGEST_EDGE_PORT:-5044}/tcp"
    networks:
      - siem-net
    depends_on:
      central-logstash:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, ssl, urllib.request;
          urllib.request.urlopen('https://localhost:' + os.environ['INGEST_EDGE_PORT'] + '/health', context=ssl._create_unverified_context())
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 15s
    mem_limit: 512m

  backup-job:
    logging: *default-logging
    build:
      context: .
      dockerfile: backup/Dockerfile
    profiles:
      - backup
    environment:
      - BACKUP_ENABLED=${BACKUP_ENABLED:-false}
      - OPENSEARCH_URL=https://opensearch:9200
      - OPENSEARCH_USER=${BACKUP_USER:-admin}
      - OPENSEARCH_PASSWORD=${BACKUP_PASSWORD:-}
      - OPENSEARCH_CA=/etc/siem/root-ca.crt
      - SNAPSHOT_REPOSITORY=${SNAPSHOT_REPOSITORY:-siem-snapshots}
    volumes:
      - ./:/repo:ro
      - ./data/backups:/backup
      - ./secrets/certs/root-ca.crt:/etc/siem/root-ca.crt:ro
    networks:
      - siem-net
    depends_on:
      opensearch:
        condition: service_healthy
    mem_limit: 256m

networks:
  siem-net:
    driver: bridge
