input {
  pipeline {
    address => "normalize"
  }
}

filter {
  if ![event][original] and [message] {
    mutate {
      copy => {
        "message" => "[event][original]"
      }
    }
  }

  ruby {
    code => 'event.set("[event][ingested]", Time.now.utc.iso8601(3))'
  }
}

output {
  pipeline {
    send_to => "opensearch-output"
  }
}
